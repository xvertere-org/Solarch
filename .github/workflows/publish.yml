name: Publish to NPM and Homebrew

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write   # required for GitHub Packages

jobs:
  pre-publish-check:
    name: Pre-Publish Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Dry-run npm pack
        run: npm pack --dry-run

      - name: Validate package.json entrypoints
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            const fieldsToCheck = [
              { field: 'main', target: pkg.main },
              { field: 'types', target: pkg.types }
            ];

            if (pkg.bin) {
              if (typeof pkg.bin === 'string') {
                fieldsToCheck.push({ field: 'bin', target: pkg.bin });
              } else {
                for (const [k, v] of Object.entries(pkg.bin)) {
                  fieldsToCheck.push({ field: 'bin.' + k, target: v });
                }
              }
            }

            if (pkg.exports) {
              function checkExports(obj, prefix = 'exports') {
                if (typeof obj === 'string') {
                  fieldsToCheck.push({ field: prefix, target: obj });
                } else if (typeof obj === 'object' && obj !== null) {
                  for (const [k, v] of Object.entries(obj)) {
                    checkExports(v, prefix + '.' + k);
                  }
                }
              }
              checkExports(pkg.exports);
            }

            let missing = [];
            for (const { field, target } of fieldsToCheck) {
              if (!target) continue;
              const resolved = path.resolve(target);
              if (!fs.existsSync(resolved)) {
                missing.push(field + ' -> ' + target + ' (resolved: ' + resolved + ')');
              }
            }

            if (missing.length > 0) {
              console.error('❌ Missing published entrypoints declared in package.json:');
              missing.forEach(m => console.error('  - ' + m));
              process.exit(1);
            }
            console.log('✔ All package.json entrypoint files exist and resolved successfully.');
          "

  publish:
    name: Build and Publish
    needs: pre-publish-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (npmjs.com)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          npm run build
          npm run build --workspace=@solarch/core-client

      - name: Publish to NPM
        continue-on-error: true
        run: |
          npm publish --access public
          npm publish --workspace=@solarch/core-client --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        # ponytail: swap name to scoped, publish, restore — no extra files
        run: |
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name='@xvertere-org/solarch';
            p.publishConfig={registry:'https://npm.pkg.github.com'};
            fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          "
          npm config set registry https://npm.pkg.github.com/
          npm config set //npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN
          npm publish --access public || true
          git checkout package.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        continue-on-error: true
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TARBALL_URL="https://registry.npmjs.org/solarch/-/solarch-${VERSION}.tgz"
          
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not configured, skipping Homebrew formula update."
            exit 0
          fi

          # Attempt to clone the homebrew-tap repo
          if ! git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/xvertere-org/homebrew-tap.git" homebrew-tap 2>/dev/null; then
            echo "homebrew-tap repository not accessible, skipping Homebrew formula update."
            exit 0
          fi

          cd homebrew-tap

          # Download tarball to compute sha256 checksum
          curl -sL -o solarch.tgz "$TARBALL_URL"
          SHA256=$(sha256sum solarch.tgz | awk '{print $1}')
          
          mkdir -p Formula
          
          cat <<EOF > Formula/solarch.rb
          class Solarch < Formula
            desc "TypeScript backend-as-a-service with SQLite, auth, realtime, and admin UI"
            homepage "https://github.com/xvertere-org/Solarch"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "Apache-2.0"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args(keep_bin: true)
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            def caveats
              <<~EOS
                ███████╗ ██████╗ ██╗      █████╗ ██████╗  ██████╗██╗  ██╗
                ██╔════╝██╔═══██╗██║     ██╔══██╗██╔══██╗██╔════╝██║  ██║
                ███████╗██║   ██║██║     ███████║██████╔╝██║     ███████║
                ╚════██║██║   ██║██║     ██╔══██║██╔══██╗██║     ██╔══██║
                ███████║╚██████╔╝███████╗██║  ██║██║  ██║╚██████╗██║  ██║
                ╚══════╝ ╚═════╝ ╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝╚═╝  ╚═╝

                v${VERSION} installed  ·  run: solarch serve --dir ./data
              EOS
            end

            test do
              system "#{bin}/solarch", "--version"
            end
          end
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/solarch.rb
          git commit -m "Update solarch to ${VERSION}"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
