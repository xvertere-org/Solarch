name: "Package Screen (Generic 3-Layer)"

on:
  workflow_call:
    inputs:
      package_path:
        required: true
        type: string
        description: "Relative path to package directory (e.g. '.' or 'packages/foo')"
      workspace_name:
        required: true
        type: string
        description: "Workspace identifier (e.g. 'root' or '@solarch/foo')"

permissions:
  contents: read

jobs:
  function:
    name: "${{ inputs.workspace_name }} — Function (Lint & Typecheck)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: |
          if [ "${{ inputs.workspace_name }}" = "root" ]; then
            npm run lint
          else
            npm run lint --workspace=${{ inputs.workspace_name }} --if-present
          fi

      - name: Run Typecheck
        run: |
          if [ "${{ inputs.workspace_name }}" = "root" ]; then
            npm run typecheck
          else
            npm run typecheck --workspace=${{ inputs.workspace_name }} --if-present
          fi

  build:
    name: "${{ inputs.workspace_name }} — Build (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    needs: function
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          if [ "${{ inputs.workspace_name }}" = "root" ]; then
            npm run build
          else
            npm run build --workspace=${{ inputs.workspace_name }} --if-present
          fi

      - name: Upload build artifacts
        if: inputs.workspace_name == 'root'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-node-${{ matrix.node-version }}
          path: |
            dist/
            admin/dist/
            pb_public/
          retention-days: 7

  service:
    name: "${{ inputs.workspace_name }} — Service (Tests & Coverage)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: |
          if [ "${{ inputs.workspace_name }}" = "root" ]; then
            npm run test:coverage
          else
            npm test --workspace=${{ inputs.workspace_name }} --if-present
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ inputs.workspace_name }}-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-${{ inputs.workspace_name }}-node-${{ matrix.node-version }}
          path: ~/.npm/_logs/
          retention-days: 14

  security:
    name: "${{ inputs.workspace_name }} — Security Audit"
    runs-on: ubuntu-latest
    needs: service
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
