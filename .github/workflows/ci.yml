name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      generic: ${{ steps.discovery.outputs.generic }}
      sdk: ${{ steps.discovery.outputs.sdk }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Package Discovery
        id: discovery
        run: node .github/scripts/discover-packages.js

  screen-generic:
    name: Generic Screen
    needs: discover
    if: needs.discover.outputs.generic != '[]' && needs.discover.outputs.generic != ''
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.generic) }}
    uses: ./.github/workflows/_package-screen.yml
    with:
      package_path: ${{ matrix.package.path }}
      workspace_name: ${{ matrix.package.workspace }}

  screen-sdk:
    name: SDK Screen
    needs: discover
    if: needs.discover.outputs.sdk != '[]' && needs.discover.outputs.sdk != ''
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.sdk) }}
    uses: ./.github/workflows/_sdk-screen.yml
    with:
      package_path: ${{ matrix.package.path }}
      workspace_name: ${{ matrix.package.workspace }}
